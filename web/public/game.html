<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: monospace;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #overlay {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #fff;
        min-width: 300px;
        z-index: 5;
      }
      #overlay h1 {
        font-size: 1.8rem;
        letter-spacing: 3px;
        margin-bottom: 0.3rem;
      }
      .sub {
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.75rem;
        letter-spacing: 2px;
        margin-bottom: 1.2rem;
      }
      .mode-btn {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 12px 20px;
        font-size: 0.9rem;
        font-family: monospace;
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 10px;
        transition: background 0.15s, border-color 0.15s;
      }
      .mode-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.5);
      }
      .mode-btn span {
        color: rgba(255, 255, 255, 0.35);
        font-size: 0.8rem;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 1.2rem;
      }
      .pick-btn {
        flex: 1;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.5);
        padding: 10px 4px;
        font-size: 0.78rem;
        font-family: monospace;
        cursor: pointer;
        border-radius: 4px;
        line-height: 1.6;
      }
      .pick-btn.active {
        border-color: #ff0;
        color: #ff0;
        text-shadow: 0 0 8px #ff0;
      }
      .pick-btn:hover:not(.active) {
        border-color: rgba(255, 255, 255, 0.4);
        color: #fff;
      }
      .back-btn {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.78rem;
        font-family: monospace;
        cursor: pointer;
        margin-top: 1.2rem;
      }
      .back-btn:hover {
        color: #fff;
      }

      #pause-overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        z-index: 10;
      }
      #pause-box {
        text-align: center;
        color: #fff;
        min-width: 220px;
      }
      #pause-box h2 {
        font-size: 1.5rem;
        letter-spacing: 4px;
        margin-bottom: 1.4rem;
        color: #ff0;
        text-shadow: 0 0 18px #ff0;
      }
      .pause-btn {
        display: block;
        width: 100%;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 11px 20px;
        font-size: 0.9rem;
        font-family: monospace;
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 10px;
        text-align: center;
        transition: background 0.15s, border-color 0.15s;
      }
      .pause-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.5);
      }
      .pause-btn.accent {
        border-color: #0f0;
        color: #0f0;
        text-shadow: 0 0 8px #0f0;
      }
      .pause-btn.accent:hover {
        background: rgba(0, 255, 0, 0.07);
      }

      #pause-float-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 15;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 1.2rem;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        transition: background 0.15s, border-color 0.15s;
      }
      #pause-float-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.4);
      }
      #pause-float-btn.visible {
        display: flex;
      }

      #win-overlay {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #fff;
        display: none;
        z-index: 11;
      }
      #win-overlay h1 {
        font-size: 2rem;
        margin-bottom: 0.6rem;
      }
      #win-overlay p {
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.78rem;
        margin-bottom: 1.4rem;
        line-height: 1.8;
      }
      #win-overlay button {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        padding: 10px 28px;
        font-size: 0.9rem;
        font-family: monospace;
        cursor: pointer;
        border-radius: 4px;
        margin: 0 5px;
      }
      #win-overlay button:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Online screens */
      .online-input {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 12px;
        font-size: 1.5rem;
        font-family: monospace;
        text-align: center;
        letter-spacing: 8px;
        width: 180px;
        border-radius: 4px;
        outline: none;
        margin-bottom: 1.2rem;
      }
      .online-input:focus {
        border-color: #ff0;
      }
      .room-code {
        font-size: 2.2rem;
        letter-spacing: 12px;
        color: #ff0;
        text-shadow: 0 0 20px #ff0;
        margin: 1rem 0;
      }
      .waiting-dots::after {
        content: "";
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .waiting-text {
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.78rem;
        animation: blink 1.2s infinite;
      }

      #disconnect-overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 20;
      }
      #disconnect-overlay h2 {
        color: #f44;
        font-size: 1.5rem;
        letter-spacing: 3px;
        margin-bottom: 0.8rem;
      }
      #disconnect-overlay p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.85rem;
        margin-bottom: 1.2rem;
      }
    </style>
    <script>
      window.env = {
        WS_SERVER:
          location.hostname === "localhost" || location.hostname === "127.0.0.1"
            ? "localhost:3000"
            : "hockey-air.onrender.com",
      };
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>

    <!-- Online lobby -->
    <div id="overlay">
      <div id="screen-online" style="display: none">
        <h1 style="font-size: 1.2rem; margin-bottom: 0.3rem">
          ONLINE MULTIPLAYER
        </h1>
        <div class="sub">PLAY ACROSS THE WORLD</div>
        <button class="mode-btn" onclick="onlineCreate()">
          Create Game <span>New Room</span>
        </button>
        <button class="mode-btn" onclick="showScreen('screen-join')">
          Join Game <span>Enter Code</span>
        </button>
        <button class="back-btn" onclick="mainMenu()">
          ← Back
        </button>
      </div>
      <div id="screen-create" style="display: none">
        <h1 style="font-size: 1.2rem; margin-bottom: 0.3rem">YOUR ROOM</h1>
        <div class="sub">SHARE THIS CODE</div>
        <div class="room-code" id="room-code-display">----</div>
        <p class="waiting-text">
          Waiting for opponent<span class="waiting-dots"></span>
        </p>
        <p
          id="room-status"
          style="
            color: #f44;
            font-size: 0.78rem;
            margin-top: 0.5rem;
            min-height: 1.2rem;
          "
        ></p>
        <button class="back-btn" onclick="onlineCancel()">
          ← Cancel
        </button>
      </div>
      <div id="screen-join" style="display: none">
        <h1 style="font-size: 1.2rem; margin-bottom: 0.3rem">JOIN GAME</h1>
        <div class="sub">ENTER ROOM CODE</div>
        <input
          class="online-input"
          id="code-input"
          type="text"
          maxlength="4"
          placeholder="CODE"
          autocomplete="off"
          oninput="this.value=this.value.toUpperCase().slice(0,4)"
        />
        <button class="mode-btn" onclick="onlineJoin()">
          JOIN <span>Enter Match</span>
        </button>
        <button class="back-btn" onclick="showScreen('screen-online')">
          ← Back
        </button>
      </div>
    </div>

    <!-- Pause overlay -->
    <div id="pause-overlay">
      <div id="pause-box">
        <h2>PAUSED</h2>
        <button class="pause-btn accent" onclick="resumeGame()">
          ▶ Resume
        </button>
        <button class="pause-btn" onclick="restartGame()">↺ Restart</button>
        <button class="pause-btn" onclick="mainMenu()">⌂ Main Menu</button>
      </div>
    </div>

    <button id="pause-float-btn" onclick="togglePause()">⏸</button>

    <!-- Win screen -->
    <div id="win-overlay">
      <h1 id="win-text"></h1>
      <p id="win-sub"></p>
      <button onclick="rematch()">Rematch</button>
      <button onclick="mainMenu()">Menu</button>
    </div>

    <!-- Disconnect overlay -->
    <div id="disconnect-overlay">
      <div style="text-align: center">
        <h2>CONNECTION LOST</h2>
        <p>Opponent disconnected</p>
        <button
          class="pause-btn"
          onclick="mainMenu()"
          style="margin: 0 auto; width: auto; padding: 10px 24px"
        >
          ⌂ Main Menu
        </button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      let W, H, GOAL_SIZE, GOAL_POS;

      // Tuning constants
      const PUCK_R = 11,
        MALLET_R = 28,
        WALL = 6;
      const FRICTION = 0.994,
        MAX_SPEED = 22,
        INIT_SPEED = 7,
        KB_SPEED = 7;
      const WALL_BOUNCE = 0.88,
        MALLET_SMOOTH = 0.38,
        AI_REACT_BASE = 0.7;
      const MALLET_IMPULSE_SPEED = 2,
        MALLET_IMPULSE_BASE = 2.5;

      let WINNING = 7;
      let score = [0, 0],
        gameActive = false,
        paused = false,
        mode = "ai",
        difficulty = "easy",
        layout = "horizontal";
      let puck = { x: 0, y: 0, vx: 0, vy: 0, r: PUCK_R },
        trail = [],
        sparks = [];
      let lastHitter = -1;
      let mallets = [
        {
          x: 0,
          y: 0,
          tx: 0,
          ty: 0,
          vx: 0,
          vy: 0,
          r: MALLET_R,
          color: "#0f0",
          glow: "#0f0",
        },
        {
          x: 0,
          y: 0,
          tx: 0,
          ty: 0,
          vx: 0,
          vy: 0,
          r: MALLET_R,
          color: "#f00",
          glow: "#f00",
        },
      ];

      // Goal announcement
      let goalTimer = 0;
      let goalColor = "#fff";
      let pendingReset = -1;

      // Online
      let ws = null;
      let playerIndex = 0;
      let roomCode = "";

      // Audio
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {}
        }
      }
      function playTone(freq, dur, type, vol) {
        try {
          initAudio();
          if (!audioCtx) return;
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.type = type || "square";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + (dur || 0.1),
          );
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + (dur || 0.1));
        } catch (e) {}
      }
      function sndWall() {
        playTone(220, 0.07, "square", 0.06);
      }
      function sndMallet() {
        playTone(330, 0.09, "square", 0.1);
      }
      function sndGoal() {
        playTone(440, 0.25, "sine", 0.12);
        setTimeout(() => playTone(660, 0.25, "sine", 0.1), 120);
      }
      function sndWin() {
        playTone(523, 0.12, "sine", 0.12);
        setTimeout(() => playTone(659, 0.12, "sine", 0.12), 120);
        setTimeout(() => playTone(784, 0.3, "sine", 0.12), 240);
      }

      const DIFF = {
        easy: {
          react: 0.35,
          predict: 0.05,
          inaccuracy: 0.5,
          maxSpd: 6,
          hitPower: 0.3,
          reactionDelay: 24,
        },
        medium: {
          react: 0.55,
          predict: 0.25,
          inaccuracy: 0.3,
          maxSpd: 10,
          hitPower: 0.6,
          reactionDelay: 16,
        },
        hard: {
          react: 0.75,
          predict: 0.55,
          inaccuracy: 0.12,
          maxSpd: 15,
          hitPower: 0.9,
          reactionDelay: 10,
        },
        pro: {
          react: 0.9,
          predict: 0.85,
          inaccuracy: 0.04,
          maxSpd: 20,
          hitPower: 1.2,
          reactionDelay: 5,
        },
      };

      let selectedDiff = "easy",
        selectedLayout = "horizontal",
        selectedWinning = 7;

      // AI state (human-like reaction delay)
      let aiTargetX = 0,
        aiTargetY = 0;
      let aiFrameCount = 0;
      let aiTargetAge = 0;

      // Animation state
      let shakeTimer = 0,
        shakeIntensity = 0;
      let scorePopTimer = [0, 0];
      let confetti = [];
      let frameCount = 0;

      // ─── Online Screen Nav ─────────────────────────────────────────────
      function showScreen(id) {
        ["screen-online", "screen-create", "screen-join"].forEach((s) => {
          document.getElementById(s).style.display =
            s === id ? "block" : "none";
        });
      }

      // ─── URL Param Parsing ─────────────────────────────────────────────
      const pageParams = new URLSearchParams(window.location.search);
      const pageMode = pageParams.get("mode") || "ai";

      // ─── Online Multiplayer ────────────────────────────────────────────
      function onlineConnect(onOpen) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          if (onOpen) onOpen();
          return;
        }
        const host = window.env.WS_SERVER || "localhost:3000";
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${proto}//${host}`);
        const timeout = setTimeout(() => {
          if (ws && ws.readyState !== WebSocket.OPEN) {
            ws.close();
            document.getElementById("room-code-display").textContent = "ERR";
            document.getElementById("room-status").textContent =
              "Connection timed out.";
          }
        }, 5000);
        ws.onopen = () => {
          clearTimeout(timeout);
          document.getElementById("room-status").textContent = "";
          if (onOpen) onOpen();
        };
        ws.onerror = () => {
          document.getElementById("room-code-display").textContent = "ERR";
          document.getElementById("room-status").textContent =
            "Connection failed. Check that the server is running.";
        };
        ws.onclose = () => {
          if (gameActive && mode === "online") {
            document.getElementById("disconnect-overlay").style.display =
              "flex";
          }
        };
        ws.onmessage = (e) => {
          let msg;
          try {
            msg = JSON.parse(e.data);
          } catch {
            return;
          }
          handleServerMsg(msg);
        };
      }

      function onlineCreate() {
        roomCode = "";
        showScreen("screen-create");
        document.getElementById("room-code-display").textContent = "....";
        onlineConnect(() =>
          ws.send(
            JSON.stringify({ type: "create_room", winning: selectedWinning }),
          ),
        );
      }

      function onlineJoin() {
        const code = document.getElementById("code-input").value.trim();
        if (code.length !== 4) return;
        roomCode = code;
        showScreen("screen-create");
        document.getElementById("room-code-display").textContent = code;
        onlineConnect(() =>
          ws.send(JSON.stringify({ type: "join_room", code })),
        );
      }

      function onlineCancel() {
        if (ws) {
          ws.close();
          ws = null;
        }
        showScreen("screen-online");
      }

      function handleServerMsg(msg) {
        switch (msg.type) {
          case "room_created":
            roomCode = msg.code;
            document.getElementById("room-code-display").textContent = msg.code;
            break;
          case "room_joined":
            playerIndex = msg.player;
            break;
          case "game_start":
            playerIndex = msg.player;
            layout = "horizontal";
            WINNING = msg.winning || 7;
            onlineStartGame();
            break;
          case "state":
            if (gameActive) applyOnlineState(msg);
            break;
          case "goal":
            goalTimer = 45;
            goalColor = msg.color;
            if (msg.color === "#0f0") sndGoal();
            break;
          case "game_over":
            gameActive = false;
            endGame(msg.winner);
            break;
          case "opponent_disconnected":
            document.getElementById("disconnect-overlay").style.display =
              "flex";
            break;
          case "room_error":
            alert(msg.message);
            showScreen("screen-online");
            break;
        }
      }

      function onlineStartGame() {
        mode = "online";
        initCanvas();
        document.getElementById("overlay").style.display = "none";
        document.getElementById("pause-overlay").style.display = "none";
        document.getElementById("disconnect-overlay").style.display = "none";
        score = [0, 0];
        gameActive = true;
        paused = false;
        goalTimer = 0;
        lastHitter = -1;
        trail = [];
        sparks = [];
      }

      function applyOnlineState(msg) {
        puck.x = msg.puck.x;
        puck.y = msg.puck.y;
        mallets[0].x = msg.mallets[0].x;
        mallets[0].y = msg.mallets[0].y;
        mallets[1].x = msg.mallets[1].x;
        mallets[1].y = msg.mallets[1].y;
        score[0] = msg.score[0];
        score[1] = msg.score[1];
        // Sync goal timer from server
        if (msg.goalTimer > 0 && goalTimer === 0) {
          goalTimer = msg.goalTimer;
          goalColor = msg.goalColor;
        }
      }

      function sendInput(nx, ny) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "input", nx, ny }));
        }
      }

      // ─── Canvas / Game Init ────────────────────────────────────────────
      function initCanvas() {
        let vw = window.innerWidth,
          vh = window.innerHeight;
        if (layout === "horizontal") {
          W = Math.min(vw, 580);
          H = Math.min(vh, 360);
        } else {
          W = Math.min(vw, 380);
          H = Math.min(vh, 620);
        }
        canvas.width = W;
        canvas.height = H;
        GOAL_SIZE = layout === "horizontal" ? H * 0.42 : W * 0.42;
        GOAL_POS =
          layout === "horizontal" ? (H - GOAL_SIZE) / 2 : (W - GOAL_SIZE) / 2;
      }

      function placeMallets() {
        if (layout === "horizontal") {
          mallets[0].x = W * 0.82;
          mallets[0].y = H / 2;
          mallets[0].tx = W * 0.82;
          mallets[0].ty = H / 2;
          mallets[1].x = W * 0.18;
          mallets[1].y = H / 2;
          mallets[1].tx = W * 0.18;
          mallets[1].ty = H / 2;
        } else {
          mallets[0].x = W / 2;
          mallets[0].y = H * 0.82;
          mallets[0].tx = W / 2;
          mallets[0].ty = H * 0.82;
          mallets[1].x = W / 2;
          mallets[1].y = H * 0.18;
          mallets[1].tx = W / 2;
          mallets[1].ty = H * 0.18;
        }
      }

      function startGame() {
        layout = selectedLayout;
        difficulty = selectedDiff;
        WINNING = selectedWinning;
        initCanvas();
        document.getElementById("overlay").style.display = "none";
        document.getElementById("pause-overlay").style.display = "none";
        score = [0, 0];
        gameActive = true;
        paused = false;
        goalTimer = 0;
        lastHitter = -1;
        aiFrameCount = 0;
        aiTargetAge = 0;
        aiTargetX = 0;
        aiTargetY = 0;
        confetti = [];
        shakeTimer = 0;
        shakeIntensity = 0;
        scorePopTimer = [0, 0];
        placeMallets();
        resetPuck(0);
      }

      function resumeGame() {
        paused = false;
        document.getElementById("pause-overlay").style.display = "none";
      }

      function restartGame() {
        paused = false;
        document.getElementById("pause-overlay").style.display = "none";
        score = [0, 0];
        gameActive = true;
        goalTimer = 0;
        lastHitter = -1;
        aiFrameCount = 0;
        aiTargetAge = 0;
        aiTargetX = 0;
        aiTargetY = 0;
        confetti = [];
        shakeTimer = 0;
        shakeIntensity = 0;
        scorePopTimer = [0, 0];
        placeMallets();
        resetPuck(0);
      }

      function mainMenu() {
        if (mode === "online" && ws) {
          ws.close();
          ws = null;
        }
        window.location.href = "index.html";
      }

      function rematch() {
        document.getElementById("win-overlay").style.display = "none";
        score = [0, 0];
        gameActive = true;
        paused = false;
        goalTimer = 0;
        lastHitter = -1;
        aiFrameCount = 0;
        aiTargetAge = 0;
        aiTargetX = 0;
        aiTargetY = 0;
        confetti = [];
        shakeTimer = 0;
        shakeIntensity = 0;
        scorePopTimer = [0, 0];
        placeMallets();
        resetPuck(0);
      }

      function togglePause() {
        if (!gameActive || mode === "online") return;
        paused = !paused;
        document.getElementById("pause-overlay").style.display = paused
          ? "flex"
          : "none";
      }

      function resetPuck(who) {
        puck.x = W / 2;
        puck.y = H / 2;
        if (layout === "horizontal") {
          let dir = who === 0 ? 1 : -1,
            a = (Math.random() - 0.5) * Math.PI * 0.5;
          puck.vx = dir * Math.cos(a) * INIT_SPEED;
          puck.vy = Math.sin(a) * INIT_SPEED;
        } else {
          let dir = who === 0 ? -1 : 1,
            a = (Math.random() - 0.5) * Math.PI * 0.5;
          puck.vx = Math.sin(a) * INIT_SPEED;
          puck.vy = dir * INIT_SPEED;
        }
        trail = [];
        lastHitter = -1;
      }

      function spawnSparks(x, y, color, count) {
        for (let i = 0; i < (count || 10); i++) {
          let a = Math.random() * Math.PI * 2,
            spd = 2 + Math.random() * 4;
          sparks.push({
            x,
            y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            life: 1,
            color,
          });
        }
      }

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }
      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      const keys = {};
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" || e.key === "p" || e.key === "P") togglePause();
        keys[e.key] = true;
        ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key) &&
          e.preventDefault();
      });
      window.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      window.addEventListener("resize", () => {
        let oldW = W,
          oldH = H;
        initCanvas();
        if (gameActive && oldW && oldH) {
          let sx = W / oldW,
            sy = H / oldH;
          puck.x *= sx;
          puck.y *= sy;
          puck.vx *= sx;
          puck.vy *= sy;
          mallets.forEach((m) => {
            m.x *= sx;
            m.y *= sy;
            m.tx *= sx;
            m.ty *= sy;
          });
          trail.forEach((t) => {
            t.x *= sx;
            t.y *= sy;
          });
          sparks.forEach((s) => {
            s.x *= sx;
            s.y *= sy;
          });
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        if (!gameActive || paused) return;
        let r = canvas.getBoundingClientRect();
        let cx = e.clientX - r.left,
          cy = e.clientY - r.top;
        if (mode === "online") {
          sendInput(cx / W, cy / H);
        } else {
          mallets[0].tx = cx;
          mallets[0].ty = cy;
        }
      });

      let touches = {};
      canvas.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          for (let t of e.changedTouches) {
            let r = canvas.getBoundingClientRect();
            let p = { x: t.clientX - r.left, y: t.clientY - r.top };
            if (paused) continue;
            if (mode === "online") {
              sendInput(p.x / W, p.y / H);
              continue;
            }
            let idx =
              layout === "horizontal"
                ? p.x > W / 2
                  ? 0
                  : 1
                : p.y > H / 2
                ? 0
                : 1;
            if (mode === "ai" && idx === 1) continue;
            touches[t.identifier] = idx;
            mallets[idx].tx = p.x;
            mallets[idx].ty = p.y;
          }
        },
        { passive: false },
      );
      canvas.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          if (paused) return;
          for (let t of e.changedTouches) {
            let r = canvas.getBoundingClientRect();
            let p = { x: t.clientX - r.left, y: t.clientY - r.top };
            if (mode === "online") {
              sendInput(p.x / W, p.y / H);
              continue;
            }
            let idx = touches[t.identifier];
            if (idx !== undefined) {
              mallets[idx].tx = p.x;
              mallets[idx].ty = p.y;
            }
          }
        },
        { passive: false },
      );
      canvas.addEventListener("touchend", (e) => {
        for (let t of e.changedTouches) delete touches[t.identifier];
      });

      function applyKeyboard() {
        if (mode !== "2p") return;
        let m = mallets[1],
          dx = 0,
          dy = 0;
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= KB_SPEED;
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += KB_SPEED;
        if (keys["ArrowUp"] || keys["w"] || keys["W"]) dy -= KB_SPEED;
        if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy += KB_SPEED;
        if (dx || dy) {
          m.tx = m.x + dx;
          m.ty = m.y + dy;
        }
      }

      function aiUpdate() {
        let d = DIFF[difficulty],
          m = mallets[1];
        let distToPuck = dist(m, puck);
        aiFrameCount++;

        // ── Recalculate target only after reactionDelay frames ──
        if (aiTargetAge === 0 || aiFrameCount % d.reactionDelay === 0) {
          let rawTx, rawTy;

          if (layout === "horizontal") {
            if (puck.vx < 0 && d.predict > 0) {
              let steps = Math.abs(
                (puck.x - m.x) / Math.max(Math.abs(puck.vx), 0.1),
              );
              rawTy = puck.y + puck.vy * steps * d.predict;
              rawTx = puck.x - W * 0.1;
            } else {
              rawTx = puck.x - W * 0.12;
              rawTy = puck.y;
            }
            rawTx += (Math.random() - 0.5) * d.inaccuracy * W * 0.2;
            rawTy += (Math.random() - 0.5) * d.inaccuracy * H * 0.2;
            rawTx = clamp(rawTx, WALL + m.r, W / 2 - m.r);
            rawTy = clamp(rawTy, WALL + m.r, H - WALL - m.r);
          } else {
            if (puck.vy < 0 && d.predict > 0) {
              let steps = Math.abs(
                (puck.y - m.y) / Math.max(Math.abs(puck.vy), 0.1),
              );
              rawTx = puck.x + puck.vx * steps * d.predict;
              rawTy = puck.y - H * 0.1;
            } else {
              rawTx = puck.x;
              rawTy = puck.y - H * 0.12;
            }
            rawTx += (Math.random() - 0.5) * d.inaccuracy * W * 0.2;
            rawTy += (Math.random() - 0.5) * d.inaccuracy * H * 0.2;
            rawTx = clamp(rawTx, WALL + m.r, W - WALL - m.r);
            rawTy = clamp(rawTy, WALL + m.r, H / 2 - m.r);
          }

          // ── Corner awareness ──
          const CORNER_ZONE = 45;
          const puckInCorner =
            (puck.x - WALL < CORNER_ZONE && puck.y - WALL < CORNER_ZONE) ||
            (layout === "horizontal"
              ? puck.x - WALL < CORNER_ZONE && H - WALL - puck.y < CORNER_ZONE
              : W - WALL - puck.x < CORNER_ZONE &&
                puck.y - WALL < CORNER_ZONE) ||
            (layout === "horizontal"
              ? false
              : W - WALL - puck.x < CORNER_ZONE &&
                H - WALL - puck.y < CORNER_ZONE);
          if (puckInCorner && Math.hypot(puck.vx, puck.vy) < 5) {
            const margin = 40;
            if (layout === "horizontal") {
              rawTx = clamp(puck.x, WALL + margin, W / 2 - margin);
              rawTy = clamp(puck.y, WALL + margin, H - WALL - margin);
            } else {
              rawTx = clamp(puck.x, WALL + margin, W - WALL - margin);
              rawTy = clamp(puck.y, WALL + margin, H / 2 - margin);
            }
          }

          // Blend toward new target (smooth transition, no instant snap)
          let blend = Math.min(1, aiTargetAge / 20 + 0.15);
          aiTargetX = aiTargetX + (rawTx - aiTargetX) * blend;
          aiTargetY = aiTargetY + (rawTy - aiTargetY) * blend;
          aiTargetAge = Math.min(aiTargetAge + 1, 9999);
        }

        // ── Move toward target (no rush boost, constant speed) ──
        let vx = (aiTargetX - m.x) * d.react * AI_REACT_BASE;
        let vy = (aiTargetY - m.y) * d.react * AI_REACT_BASE;
        let spd = Math.hypot(vx, vy);
        if (spd > d.maxSpd) {
          vx = (vx / spd) * d.maxSpd;
          vy = (vy / spd) * d.maxSpd;
        }

        // ── Shot power (only when puck is touching, wider aim, lower power) ──
        if (distToPuck < m.r + puck.r + 6) {
          let aimX, aimY;
          if (layout === "horizontal") {
            aimX = W - WALL - m.r;
            aimY = puck.y + (Math.random() - 0.5) * GOAL_SIZE * 0.8;
            vx += (aimX - puck.x) * d.hitPower * 0.18;
            vy += (aimY - puck.y) * d.hitPower * 0.12;
          } else {
            aimY = H - WALL - m.r;
            aimX = puck.x + (Math.random() - 0.5) * GOAL_SIZE * 0.8;
            vx += (aimX - puck.x) * d.hitPower * 0.12;
            vy += (aimY - puck.y) * d.hitPower * 0.18;
          }
          // No speed cap overshoot — stays within maxSpd
          let spd2 = Math.hypot(vx, vy);
          if (spd2 > d.maxSpd) {
            vx = (vx / spd2) * d.maxSpd;
            vy = (vy / spd2) * d.maxSpd;
          }
        }

        m.vx = vx;
        m.vy = vy;
        if (layout === "horizontal") {
          m.x = clamp(m.x + vx, WALL + m.r, W / 2 - 2);
          m.y = clamp(m.y + vy, WALL + m.r, H - WALL - m.r);
        } else {
          m.x = clamp(m.x + vx, WALL + m.r, W - WALL - m.r);
          m.y = clamp(m.y + vy, WALL + m.r, H / 2 - 2);
        }
      }

      function updateMallet(m, i) {
        if (mode === "ai" && i === 1) return;
        let dx = m.tx - m.x,
          dy = m.ty - m.y;
        m.vx = dx * MALLET_SMOOTH;
        m.vy = dy * MALLET_SMOOTH;
        m.x += m.vx;
        m.y += m.vy;
        if (layout === "horizontal") {
          if (i === 0) {
            m.x = clamp(m.x, W / 2 + 2, W - WALL - m.r);
            m.y = clamp(m.y, WALL + m.r, H - WALL - m.r);
          } else {
            m.x = clamp(m.x, WALL + m.r, W / 2 - 2);
            m.y = clamp(m.y, WALL + m.r, H - WALL - m.r);
          }
        } else {
          if (i === 0) {
            m.x = clamp(m.x, WALL + m.r, W - WALL - m.r);
            m.y = clamp(m.y, H / 2 + 2, H - WALL - m.r);
          } else {
            m.x = clamp(m.x, WALL + m.r, W - WALL - m.r);
            m.y = clamp(m.y, WALL + m.r, H / 2 - 2);
          }
        }
      }

      function updatePuck() {
        trail.push({
          x: puck.x,
          y: puck.y,
          color: mallets[lastHitter >= 0 ? lastHitter : 0].color,
        });
        if (trail.length > 20) trail.shift();
        let spd = Math.hypot(puck.vx, puck.vy);
        if (spd > puck.r * 1.5) {
          let scale = (puck.r * 1.5) / spd;
          puck.vx *= scale;
          puck.vy *= scale;
        }
        puck.x += puck.vx;
        puck.y += puck.vy;
        puck.vx *= FRICTION;
        puck.vy *= FRICTION;
        spd = Math.hypot(puck.vx, puck.vy);
        if (spd > MAX_SPEED) {
          puck.vx = (puck.vx / spd) * MAX_SPEED;
          puck.vy = (puck.vy / spd) * MAX_SPEED;
        }
        if (spd < 0.5) {
          puck.vx += (Math.random() - 0.5) * 0.8;
          puck.vy += (Math.random() - 0.5) * 0.8;
        }
        if (layout === "horizontal") {
          if (puck.y - puck.r < WALL) {
            puck.y = WALL + puck.r;
            puck.vy = Math.abs(puck.vy) * WALL_BOUNCE;
            spawnSparks(puck.x, WALL, "#fff");
            sndWall();
          }
          if (puck.y + puck.r > H - WALL) {
            puck.y = H - WALL - puck.r;
            puck.vy = -Math.abs(puck.vy) * WALL_BOUNCE;
            spawnSparks(puck.x, H - WALL, "#fff");
            sndWall();
          }
          if (puck.x - puck.r < WALL) {
            if (puck.y > GOAL_POS && puck.y < GOAL_POS + GOAL_SIZE) {
              score[0]++;
              scorePopTimer[0] = 20;
              spawnSparks(puck.x, puck.y, "#0f0", 30);
              sndGoal();
              if (score[0] >= WINNING) {
                gameActive = false;
                endGame(0);
              } else {
                goalTimer = 45;
                goalColor = "#0f0";
                pendingReset = 1;
              }
              return;
            }
            puck.x = WALL + puck.r;
            puck.vx = Math.abs(puck.vx) * WALL_BOUNCE;
            spawnSparks(WALL, puck.y, "#fff");
            sndWall();
          }
          if (puck.x + puck.r > W - WALL) {
            if (puck.y > GOAL_POS && puck.y < GOAL_POS + GOAL_SIZE) {
              score[1]++;
              scorePopTimer[1] = 20;
              spawnSparks(puck.x, puck.y, "#f00", 30);
              sndGoal();
              if (score[1] >= WINNING) {
                gameActive = false;
                endGame(1);
              } else {
                goalTimer = 45;
                goalColor = "#f00";
                pendingReset = 0;
              }
              return;
            }
            puck.x = W - WALL - puck.r;
            puck.vx = -Math.abs(puck.vx) * WALL_BOUNCE;
            spawnSparks(W - WALL, puck.y, "#fff");
            sndWall();
          }
        } else {
          if (puck.x - puck.r < WALL) {
            puck.x = WALL + puck.r;
            puck.vx = Math.abs(puck.vx) * WALL_BOUNCE;
            spawnSparks(WALL, puck.y, "#fff");
            sndWall();
          }
          if (puck.x + puck.r > W - WALL) {
            puck.x = W - WALL - puck.r;
            puck.vx = -Math.abs(puck.vx) * WALL_BOUNCE;
            spawnSparks(W - WALL, puck.y, "#fff");
            sndWall();
          }
          if (puck.y - puck.r < WALL) {
            if (puck.x > GOAL_POS && puck.x < GOAL_POS + GOAL_SIZE) {
              score[1]++;
              scorePopTimer[1] = 20;
              spawnSparks(puck.x, puck.y, "#f00", 30);
              sndGoal();
              if (score[1] >= WINNING) {
                gameActive = false;
                endGame(1);
              } else {
                goalTimer = 45;
                goalColor = "#f00";
                pendingReset = 0;
              }
              return;
            }
            puck.y = WALL + puck.r;
            puck.vy = Math.abs(puck.vy) * WALL_BOUNCE;
            spawnSparks(puck.x, WALL, "#fff");
            sndWall();
          }
          if (puck.y + puck.r > H - WALL) {
            if (puck.x > GOAL_POS && puck.x < GOAL_POS + GOAL_SIZE) {
              score[0]++;
              scorePopTimer[0] = 20;
              spawnSparks(puck.x, puck.y, "#0f0", 30);
              sndGoal();
              if (score[0] >= WINNING) {
                gameActive = false;
                endGame(0);
              } else {
                goalTimer = 45;
                goalColor = "#0f0";
                pendingReset = 1;
              }
              return;
            }
            puck.y = H - WALL - puck.r;
            puck.vy = -Math.abs(puck.vy) * WALL_BOUNCE;
            spawnSparks(puck.x, H - WALL, "#fff");
            sndWall();
          }
        }
        // ── Corner escape ──
        if (Math.hypot(puck.vx, puck.vy) < 3) {
          const Z = 40,
            N = 2;
          if (puck.x - WALL < Z && puck.y - WALL < Z) {
            puck.vx += N;
            puck.vy += N;
          } else if (W - WALL - puck.x < Z && puck.y - WALL < Z) {
            puck.vx -= N;
            puck.vy += N;
          } else if (puck.x - WALL < Z && H - WALL - puck.y < Z) {
            puck.vx += N;
            puck.vy -= N;
          } else if (W - WALL - puck.x < Z && H - WALL - puck.y < Z) {
            puck.vx -= N;
            puck.vy -= N;
          }
        }
        for (let i = 0; i < 2; i++) {
          let m = mallets[i],
            d2 = dist(puck, m);
          if (d2 < puck.r + m.r) {
            let nx = (puck.x - m.x) / d2,
              ny = (puck.y - m.y) / d2;
            puck.x += nx * (puck.r + m.r - d2);
            puck.y += ny * (puck.r + m.r - d2);
            if (layout === "horizontal") {
              if (puck.x - puck.r < WALL) {
                puck.x = WALL + puck.r;
                puck.vx = Math.abs(puck.vx) * WALL_BOUNCE;
              }
              if (puck.x + puck.r > W - WALL) {
                puck.x = W - WALL - puck.r;
                puck.vx = -Math.abs(puck.vx) * WALL_BOUNCE;
              }
              if (puck.y - puck.r < WALL) {
                puck.y = WALL + puck.r;
                puck.vy = Math.abs(puck.vy) * WALL_BOUNCE;
              }
              if (puck.y + puck.r > H - WALL) {
                puck.y = H - WALL - puck.r;
                puck.vy = -Math.abs(puck.vy) * WALL_BOUNCE;
              }
            } else {
              if (puck.y - puck.r < WALL) {
                puck.y = WALL + puck.r;
                puck.vy = Math.abs(puck.vy) * WALL_BOUNCE;
              }
              if (puck.y + puck.r > H - WALL) {
                puck.y = H - WALL - puck.r;
                puck.vy = -Math.abs(puck.vy) * WALL_BOUNCE;
              }
              if (puck.x - puck.r < WALL) {
                puck.x = WALL + puck.r;
                puck.vx = Math.abs(puck.vx) * WALL_BOUNCE;
              }
              if (puck.x + puck.r > W - WALL) {
                puck.x = W - WALL - puck.r;
                puck.vx = -Math.abs(puck.vx) * WALL_BOUNCE;
              }
            }
            let dot = puck.vx * nx + puck.vy * ny;
            let imp =
              Math.hypot(m.vx, m.vy) * MALLET_IMPULSE_SPEED +
              MALLET_IMPULSE_BASE;
            puck.vx = puck.vx - 2 * dot * nx + m.vx * imp * nx;
            puck.vy = puck.vy - 2 * dot * ny + m.vy * imp * ny;
            let s2 = Math.hypot(puck.vx, puck.vy);
            if (s2 > MAX_SPEED) {
              puck.vx = (puck.vx / s2) * MAX_SPEED;
              puck.vy = (puck.vy / s2) * MAX_SPEED;
            }
            lastHitter = i;
            spawnSparks(puck.x, puck.y, m.color);
            sndMallet();
            shakeTimer = 6;
            shakeIntensity = Math.min(shakeIntensity + 0.8, 4);
          }
        }
      }

      function updateSparks() {
        for (let i = sparks.length - 1; i >= 0; i--) {
          let s = sparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.15;
          s.life -= 0.06;
          if (s.life <= 0) sparks.splice(i, 1);
        }
      }

      function updateConfetti() {
        for (let i = confetti.length - 1; i >= 0; i--) {
          let c = confetti[i];
          c.x += c.vx;
          c.y += c.vy;
          c.vy += 0.05;
          c.life -= 0.011;
          if (c.life <= 0) confetti.splice(i, 1);
        }
      }

      function endGame(winner) {
        gameActive = false;
        sndWin();
        // Confetti
        let cols = ["#0f0", "#f00", "#ff0", "#00f", "#fff", "#f0f", "#0ff"];
        for (let i = 0; i < 40; i++) {
          confetti.push({
            x: Math.random() * W,
            y: -10 - Math.random() * 20,
            vx: (Math.random() - 0.5) * 2,
            vy: 1 + Math.random() * 3,
            color: cols[Math.floor(Math.random() * cols.length)],
            life: 1,
            size: 3 + Math.random() * 4,
          });
        }
        let wo = document.getElementById("win-overlay");
        let wt = document.getElementById("win-text"),
          ws = document.getElementById("win-sub");
        let c = winner === 0 ? "#0f0" : "#f00";
        wt.style.color = c;
        wt.style.textShadow = `0 0 28px ${c}`;
        if (mode === "ai") {
          wt.textContent = winner === 0 ? "You Win!" : "Computer Wins!";
          ws.innerHTML = `Score: ${score[0]} – ${
            score[1]
          }<br>Difficulty: ${difficulty.toUpperCase()}`;
        } else if (mode === "online") {
          wt.textContent = winner === playerIndex ? "You Win!" : "You Lose!";
          ws.innerHTML = `Score: ${score[0]} – ${score[1]}`;
        } else {
          wt.textContent = `Player ${winner === 0 ? "1" : "2"} Wins!`;
          ws.innerHTML = `Score: ${score[0]} – ${score[1]}<br>P1: Mouse &nbsp;|&nbsp; P2: WASD / Arrows`;
        }
        wo.style.display = "block";
      }

      function neonLine(x1, y1, x2, y2, color, w) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
        ctx.strokeStyle = color;
        ctx.lineWidth = w || 3;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      function drawGoalFlash() {
        if (!goalTimer) return;
        let a = goalTimer / 45;
        let fs = Math.round(Math.min(W, H) * 0.22);
        ctx.save();
        ctx.globalAlpha = a * 0.85;
        ctx.shadowColor = goalColor;
        ctx.shadowBlur = 40;
        ctx.font = `bold ${fs}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = goalColor;
        ctx.fillText("GOAL!", W / 2, H / 2);
        ctx.restore();
      }

      function drawTable() {
        ctx.clearRect(0, 0, W, H);
        // Shake
        if (shakeTimer > 0) {
          let sx = (Math.random() - 0.5) * shakeIntensity;
          let sy = (Math.random() - 0.5) * shakeIntensity;
          ctx.save();
          ctx.translate(sx, sy);
        }
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.28, 0, Math.PI * 2);
        ctx.stroke();
        if (layout === "horizontal") {
          ctx.save();
          ctx.shadowColor = "rgba(255,255,255,0.25)";
          ctx.shadowBlur = 10;
          ctx.setLineDash([8, 6]);
          ctx.strokeStyle = "rgba(255,255,255,0.35)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(W / 2, WALL);
          ctx.lineTo(W / 2, H - WALL);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
          neonLine(WALL, WALL, W - WALL, WALL, "#00f", 3);
          neonLine(WALL, H - WALL, W - WALL, H - WALL, "#00f", 3);
          neonLine(WALL, WALL, WALL, GOAL_POS, "#f00", 3);
          neonLine(WALL, GOAL_POS + GOAL_SIZE, WALL, H - WALL, "#f00", 3);
          neonLine(W - WALL, WALL, W - WALL, GOAL_POS, "#0f0", 3);
          neonLine(
            W - WALL,
            GOAL_POS + GOAL_SIZE,
            W - WALL,
            H - WALL,
            "#0f0",
            3,
          );
          let fs = Math.round(H * 0.1);
          ctx.font = `bold ${fs}px monospace`;
          ctx.textAlign = "center";
          ["#f00", "#0f0"].forEach((c, i) => {
            let pop =
              scorePopTimer[i] > 0 ? 1 + (scorePopTimer[i] / 20) * 0.4 : 1;
            ctx.save();
            ctx.translate(
              i === 0 ? W / 2 - H * 0.16 : W / 2 + H * 0.16,
              H * 0.13,
            );
            ctx.scale(pop, pop);
            ctx.fillStyle = c;
            ctx.shadowColor = c;
            ctx.shadowBlur = scorePopTimer[i] > 0 ? 30 : 14;
            ctx.fillText(score[i], 0, 0);
            ctx.restore();
          });
          ctx.shadowBlur = 0;
          ctx.font = ".58rem monospace";
          ctx.fillStyle = "rgba(255,0,0,0.35)";
          ctx.fillText(
            mode === "ai" ? `CPU·${difficulty.toUpperCase()}` : "P2·WASD",
            W * 0.1,
            H * 0.92,
          );
          ctx.fillStyle = "rgba(0,255,0,0.35)";
          ctx.fillText("P1·MOUSE", W * 0.9, H * 0.92);
        } else {
          ctx.save();
          ctx.shadowColor = "rgba(255,255,255,0.25)";
          ctx.shadowBlur = 10;
          ctx.setLineDash([8, 6]);
          ctx.strokeStyle = "rgba(255,255,255,0.35)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(WALL, H / 2);
          ctx.lineTo(W - WALL, H / 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
          neonLine(WALL, WALL, W - WALL, WALL, "#f00", 3);
          neonLine(WALL, H - WALL, W - WALL, H - WALL, "#0f0", 3);
          neonLine(WALL, WALL, WALL, H - WALL, "#00f", 3);
          neonLine(W - WALL, WALL, W - WALL, H - WALL, "#00f", 3);
          ctx.fillStyle = "#000";
          ctx.fillRect(WALL - 1, WALL - 1, GOAL_POS - (WALL - 1), 6);
          ctx.fillRect(
            GOAL_POS + GOAL_SIZE,
            WALL - 1,
            W - GOAL_POS - GOAL_SIZE - WALL + 1,
            6,
          );
          ctx.fillRect(WALL - 1, H - WALL - 1, GOAL_POS - (WALL - 1), 6);
          ctx.fillRect(
            GOAL_POS + GOAL_SIZE,
            H - WALL - 1,
            W - GOAL_POS - GOAL_SIZE - WALL + 1,
            6,
          );
          let fs = Math.round(W * 0.1);
          ctx.font = `bold ${fs}px monospace`;
          ctx.textAlign = "center";
          ["#f00", "#0f0"].forEach((c, i) => {
            let pop =
              scorePopTimer[i] > 0 ? 1 + (scorePopTimer[i] / 20) * 0.4 : 1;
            ctx.save();
            ctx.translate(
              i === 0 ? W / 2 - W * 0.16 : W / 2 + W * 0.16,
              H / 2 - 8,
            );
            ctx.scale(pop, pop);
            ctx.fillStyle = c;
            ctx.shadowColor = c;
            ctx.shadowBlur = scorePopTimer[i] > 0 ? 30 : 14;
            ctx.fillText(score[i], 0, 0);
            ctx.restore();
          });
          ctx.shadowBlur = 0;
          ctx.font = ".58rem monospace";
          ctx.fillStyle = "rgba(255,0,0,0.35)";
          ctx.textAlign = "center";
          ctx.fillText(
            mode === "ai" ? `CPU·${difficulty.toUpperCase()}` : "P2·WASD",
            W / 2,
            20,
          );
          ctx.fillStyle = "rgba(255,0,255,0.4)";
          ctx.fillText("ONLINE", W / 2, H - 8);
        }
        drawGoalFlash();
        // Confetti
        for (let c of confetti) {
          ctx.save();
          ctx.globalAlpha = c.life;
          ctx.fillStyle = c.color;
          ctx.shadowColor = c.color;
          ctx.shadowBlur = 6;
          ctx.fillRect(
            c.x - c.size / 2,
            c.y - c.size / 2,
            c.size,
            c.size * 0.6,
          );
          ctx.restore();
        }
        if (shakeTimer > 0) ctx.restore();
      }

      function drawTrail() {
        for (let i = 0; i < trail.length; i++) {
          let a = i / trail.length;
          ctx.beginPath();
          ctx.arc(
            trail[i].x,
            trail[i].y,
            puck.r * (0.2 + 0.8 * a),
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = trail[i].color;
          ctx.globalAlpha = a * 0.3;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
      function drawSparks() {
        for (let s of sparks) {
          ctx.save();
          ctx.globalAlpha = s.life;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 8;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      function drawPuck() {
        ctx.save();
        let glow = 14 + 6 * Math.sin(frameCount * 0.08);
        ctx.shadowColor = "#ff0";
        ctx.shadowBlur = glow;
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffe033";
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
      function drawMallet(m) {
        ctx.save();
        ctx.shadowColor = m.color;
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.strokeStyle = m.color;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = m.color;
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        frameCount++;
        document
          .getElementById("pause-float-btn")
          .classList.toggle(
            "visible",
            gameActive && !paused && mode !== "online",
          );
        if (gameActive && !paused) {
          if (mode === "online") {
            if (goalTimer > 0) goalTimer--;
          } else if (mode === "ai") {
            aiUpdate();
            updateMallet(mallets[0], 0);
          } else {
            applyKeyboard();
            updateMallet(mallets[0], 0);
            if (mode === "2p") updateMallet(mallets[1], 1);
          }
          if (mode !== "online") {
            if (goalTimer) {
              goalTimer--;
              if (!goalTimer && pendingReset >= 0) {
                resetPuck(pendingReset);
                pendingReset = -1;
              }
            } else {
              updatePuck();
            }
            updateSparks();
          }
        }
        // Animation timers
        if (shakeTimer > 0) {
          shakeTimer--;
          if (shakeTimer === 0) shakeIntensity = 0;
        }
        scorePopTimer[0] = Math.max(0, scorePopTimer[0] - 1);
        scorePopTimer[1] = Math.max(0, scorePopTimer[1] - 1);
        updateConfetti();
        drawTable();
        drawTrail();
        drawSparks();
        drawPuck();
        drawMallet(mallets[0]);
        drawMallet(mallets[1]);
        requestAnimationFrame(loop);
      }

      initCanvas();
      loop();

      if (pageMode === "online") {
        mode = "online";
        document.getElementById("overlay").style.display = "block";
        showScreen("screen-online");
      } else {
        mode = pageMode;
        selectedDiff = pageParams.get("difficulty") || "easy";
        selectedLayout = pageParams.get("layout") || "horizontal";
        selectedWinning = parseInt(pageParams.get("winning")) || 7;
        startGame();
      }
    </script>
  </body>
</html>
