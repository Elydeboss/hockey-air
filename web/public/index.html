<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; display:flex; align-items:center; justify-content:center; height:100vh; font-family:monospace; }
#overlay { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; color:#fff; min-width:300px; z-index:5; }
#overlay h1 { font-size:1.8rem; letter-spacing:3px; margin-bottom:.3rem; }
.sub { color:rgba(255,255,255,0.4); font-size:.75rem; letter-spacing:2px; margin-bottom:1.2rem; }
.mode-btn { display:flex; justify-content:space-between; align-items:center; width:100%; background:transparent; border:1px solid rgba(255,255,255,0.25); color:#fff; padding:12px 20px; font-size:.9rem; font-family:monospace; cursor:pointer; border-radius:4px; margin-bottom:10px; transition:background .15s,border-color .15s; }
.mode-btn:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.5); }
.mode-btn span { color:rgba(255,255,255,0.35); font-size:.8rem; }
.row { display:flex; gap:8px; margin-bottom:1.2rem; }
.pick-btn { flex:1; background:transparent; border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); padding:10px 4px; font-size:.78rem; font-family:monospace; cursor:pointer; border-radius:4px; line-height:1.6; }
.pick-btn.active { border-color:#ff0; color:#ff0; text-shadow:0 0 8px #ff0; }
.pick-btn:hover:not(.active) { border-color:rgba(255,255,255,0.4); color:#fff; }
.back-btn { background:transparent; border:none; color:rgba(255,255,255,0.3); font-size:.78rem; font-family:monospace; cursor:pointer; margin-top:1.2rem; }
.back-btn:hover { color:#fff; }
</style>
<script>
window.env = {
  WS_SERVER: location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "localhost:3000"
    : "hockey-air.onrender.com",
};
</script>
</head>
<body>
<div id="overlay">
  <div id="screen-menu">
    <h1>AIR HOCKEY</h1>
    <div class="sub">NEON EDITION</div>
    <button class="mode-btn" onclick="goMode('ai')">VS Computer <span>1 Player</span></button>
    <button class="mode-btn" onclick="goMode('2p')">VS Player 2 <span>2 Players</span></button>
    <button class="mode-btn" onclick="startOnline()">Online <span>Multiplayer</span></button>
  </div>
  <div id="screen-mode" style="display:none">
    <h1 style="font-size:1.2rem;margin-bottom:.3rem">SELECT DIFFICULTY</h1>
    <div class="sub">VS COMPUTER</div>
    <div class="row">
      <button class="pick-btn active" id="d-easy" onclick="setDiff('easy')">EASY</button>
      <button class="pick-btn" id="d-medium" onclick="setDiff('medium')">MEDIUM</button>
      <button class="pick-btn" id="d-hard" onclick="setDiff('hard')">HARD</button>
      <button class="pick-btn" id="d-pro" onclick="setDiff('pro')">PRO</button>
    </div>
    <button class="mode-btn" onclick="showScreen('screen-layout')">NEXT <span>Choose Layout</span></button>
    <button class="back-btn" onclick="showScreen('screen-menu')">← Back</button>
  </div>
  <div id="screen-layout" style="display:none">
    <h1 style="font-size:1.2rem;margin-bottom:.3rem">TABLE LAYOUT</h1>
    <div class="sub">VS COMPUTER</div>
    <div class="row">
      <button class="pick-btn active" id="l-horizontal" onclick="setLayout('horizontal')" style="padding:16px 4px">HORIZONTAL<br><span style="font-size:.68rem;opacity:.5">Landscape</span></button>
      <button class="pick-btn" id="l-vertical" onclick="setLayout('vertical')" style="padding:16px 4px">VERTICAL<br><span style="font-size:.68rem;opacity:.5">Portrait</span></button>
    </div>
    <div class="row" style="justify-content:center;gap:6px">
      <span style="color:rgba(255,255,255,0.3);font-size:.7rem;letter-spacing:1px;align-self:center">FIRST TO</span>
      <button class="pick-btn active" id="w-3" onclick="setWinning(3)" style="flex:0;padding:6px 12px;font-size:.78rem">3</button>
      <button class="pick-btn" id="w-5" onclick="setWinning(5)" style="flex:0;padding:6px 12px;font-size:.78rem">5</button>
      <button class="pick-btn" id="w-7" onclick="setWinning(7)" style="flex:0;padding:6px 12px;font-size:.78rem">7</button>
      <button class="pick-btn" id="w-10" onclick="setWinning(10)" style="flex:0;padding:6px 12px;font-size:.78rem">10</button>
    </div>
    <button class="mode-btn" onclick="startGame()">START GAME <span id="win-label">First to 7</span></button>
    <button class="back-btn" onclick="showScreen('screen-mode')">← Back</button>
  </div>
  <div id="screen-layout-2p" style="display:none">
    <h1 style="font-size:1.2rem;margin-bottom:.3rem">TABLE LAYOUT</h1>
    <div class="sub">2 PLAYERS</div>
    <div class="row">
      <button class="pick-btn active" id="l2-horizontal" onclick="setLayout('horizontal')" style="padding:16px 4px">HORIZONTAL<br><span style="font-size:.68rem;opacity:.5">Mouse vs WASD</span></button>
      <button class="pick-btn" id="l2-vertical" onclick="setLayout('vertical')" style="padding:16px 4px">VERTICAL<br><span style="font-size:.68rem;opacity:.5">Mouse vs WASD</span></button>
    </div>
    <div class="row" style="justify-content:center;gap:6px">
      <span style="color:rgba(255,255,255,0.3);font-size:.7rem;letter-spacing:1px;align-self:center">FIRST TO</span>
      <button class="pick-btn active" id="w2-3" onclick="setWinning(3)" style="flex:0;padding:6px 12px;font-size:.78rem">3</button>
      <button class="pick-btn" id="w2-5" onclick="setWinning(5)" style="flex:0;padding:6px 12px;font-size:.78rem">5</button>
      <button class="pick-btn" id="w2-7" onclick="setWinning(7)" style="flex:0;padding:6px 12px;font-size:.78rem">7</button>
      <button class="pick-btn" id="w2-10" onclick="setWinning(10)" style="flex:0;padding:6px 12px;font-size:.78rem">10</button>
    </div>
    <button class="mode-btn" onclick="startGame()">START GAME <span id="win-label-2p">First to 7</span></button>
    <button class="back-btn" onclick="showScreen('screen-menu')">← Back</button>
  </div>

</div>
<script>
let selectedDiff = "easy", selectedLayout = "horizontal", selectedWinning = 7, selectedMode = "ai";

function showScreen(id) {
  ["screen-menu","screen-mode","screen-layout","screen-layout-2p"].forEach(s => {
    document.getElementById(s).style.display = s === id ? "block" : "none";
  });
}
function setDiff(d) {
  selectedDiff = d;
  ["easy","medium","hard","pro"].forEach(x => document.getElementById("d-"+x).classList.toggle("active", x === d));
}
function setLayout(l) {
  selectedLayout = l;
  ["horizontal","vertical"].forEach(x => {
    let e1 = document.getElementById("l-"+x), e2 = document.getElementById("l2-"+x);
    if (e1) e1.classList.toggle("active", x === l);
    if (e2) e2.classList.toggle("active", x === l);
  });
}
function setWinning(n) {
  selectedWinning = n;
  [3,5,7,10].forEach(x => {
    let e1 = document.getElementById("w-"+x), e2 = document.getElementById("w2-"+x);
    if (e1) e1.classList.toggle("active", x === n);
    if (e2) e2.classList.toggle("active", x === n);
  });
  let label = "First to " + n;
  let el = document.getElementById("win-label");
  if (el) el.textContent = label;
  let el2 = document.getElementById("win-label-2p");
  if (el2) el2.textContent = label;
}
function goMode(m) {
  selectedMode = m;
  if (m === "2p") showScreen("screen-layout-2p");
  else showScreen("screen-mode");
}
function startGame() {
  window.location.href = "game.html?mode=" + selectedMode + "&difficulty=" + selectedDiff + "&layout=" + selectedLayout + "&winning=" + selectedWinning;
}
function startOnline() {
  window.location.href = "game.html?mode=online";
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
