<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
.pick-btn:not(.active-neon):hover { border-color: rgba(255,255,255,0.4); color: #fff; }
.active-neon { border-color: #ff0 !important; color: #ff0 !important; text-shadow: 0 0 8px #ff0; }
</style>
<script>
window.env = {
  WS_SERVER: location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "localhost:3000"
    : "hockey-air.onrender.com",
};
</script>
</head>
<body class="bg-black overflow-hidden flex items-center justify-center h-screen font-mono">
<div id="overlay" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-center text-white min-w-[300px] z-10">
  <div id="screen-menu">
    <h1 class="text-2xl tracking-wide mb-1">AIR HOCKEY</h1>
    <div class="text-white/40 text-xs tracking-wider mb-5">NEON EDITION</div>
    <button class="flex items-center justify-between w-full bg-transparent border border-white/25 text-white px-5 py-3 text-sm font-mono cursor-pointer rounded mb-2.5 hover:bg-white/10 hover:border-white/50 transition-colors duration-150" onclick="goMode('ai')">VS Computer <span class="text-white/35 text-xs">1 Player</span></button>
    <button class="flex items-center justify-between w-full bg-transparent border border-white/25 text-white px-5 py-3 text-sm font-mono cursor-pointer rounded mb-2.5 hover:bg-white/10 hover:border-white/50 transition-colors duration-150" onclick="goMode('2p')">VS Player 2 <span class="text-white/35 text-xs">2 Players</span></button>
    <button class="flex items-center justify-between w-full bg-transparent border border-white/25 text-white px-5 py-3 text-sm font-mono cursor-pointer rounded mb-2.5 hover:bg-white/10 hover:border-white/50 transition-colors duration-150" onclick="startOnline()">Online <span class="text-white/35 text-xs">Multiplayer</span></button>
    <button class="flex items-center justify-between w-full bg-transparent border border-white/25 text-white px-5 py-3 text-sm font-mono cursor-pointer rounded mb-2.5 hover:bg-white/10 hover:border-white/50 transition-colors duration-150 hidden border-yellow-300 text-yellow-300" id="install-btn" onclick="installApp()">⬇ Install App <span class="text-white/35 text-xs">Add to Home Screen</span></button>
  </div>
  <div id="screen-mode" class="hidden">
    <h1 class="text-base mb-1">SELECT DIFFICULTY</h1>
    <div class="text-white/40 text-xs tracking-wider mb-5">VS COMPUTER</div>
    <div class="flex gap-2 mb-5">
      <button class="flex-1 bg-transparent border border-white/20 text-white/50 px-1 py-2.5 text-xs font-mono cursor-pointer rounded leading-relaxed active-neon" id="d-easy" onclick="setDiff('easy')">EASY</button>
      <button class="flex-1 bg-transparent border border-white/20 text-white/50 px-1 py-2.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="d-medium" onclick="setDiff('medium')">MEDIUM</button>
      <button class="flex-1 bg-transparent border border-white/20 text-white/50 px-1 py-2.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="d-hard" onclick="setDiff('hard')">HARD</button>
      <button class="flex-1 bg-transparent border border-white/20 text-white/50 px-1 py-2.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="d-pro" onclick="setDiff('pro')">PRO</button>
    </div>
    <div class="flex justify-center gap-1.5 mb-5">
      <span class="text-white/30 text-[0.7rem] tracking-wider self-center">FIRST TO</span>
      <button class="bg-transparent border border-white/20 text-white/50 px-3 py-1.5 text-xs font-mono cursor-pointer rounded leading-relaxed active-neon" id="w-3" onclick="setWinning(3)">3</button>
      <button class="bg-transparent border border-white/20 text-white/50 px-3 py-1.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="w-5" onclick="setWinning(5)">5</button>
      <button class="bg-transparent border border-white/20 text-white/50 px-3 py-1.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="w-7" onclick="setWinning(7)">7</button>
      <button class="bg-transparent border border-white/20 text-white/50 px-3 py-1.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="w-10" onclick="setWinning(10)">10</button>
    </div>
    <button class="flex items-center justify-between w-full bg-transparent border border-white/25 text-white px-5 py-3 text-sm font-mono cursor-pointer rounded mb-2.5 hover:bg-white/10 hover:border-white/50 transition-colors duration-150" onclick="startGame()">START GAME <span class="text-white/35 text-xs" id="win-label">First to 7</span></button>
    <button class="bg-transparent border-none text-white/30 text-xs font-mono cursor-pointer mt-5 hover:text-white" onclick="showScreen('screen-menu')">← Back</button>
  </div>
  <div id="screen-2p" class="hidden">
    <h1 class="text-base mb-1">2 PLAYERS</h1>
    <div class="text-white/40 text-xs tracking-wider mb-5">LOCAL MATCH</div>
    <div class="flex justify-center gap-1.5 mb-5">
      <span class="text-white/30 text-[0.7rem] tracking-wider self-center">FIRST TO</span>
      <button class="bg-transparent border border-white/20 text-white/50 px-3 py-1.5 text-xs font-mono cursor-pointer rounded leading-relaxed active-neon" id="w2-3" onclick="setWinning(3)">3</button>
      <button class="bg-transparent border border-white/20 text-white/50 px-3 py-1.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="w2-5" onclick="setWinning(5)">5</button>
      <button class="bg-transparent border border-white/20 text-white/50 px-3 py-1.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="w2-7" onclick="setWinning(7)">7</button>
      <button class="bg-transparent border border-white/20 text-white/50 px-3 py-1.5 text-xs font-mono cursor-pointer rounded leading-relaxed" id="w2-10" onclick="setWinning(10)">10</button>
    </div>
    <button class="flex items-center justify-between w-full bg-transparent border border-white/25 text-white px-5 py-3 text-sm font-mono cursor-pointer rounded mb-2.5 hover:bg-white/10 hover:border-white/50 transition-colors duration-150" onclick="startGame()">START GAME <span class="text-white/35 text-xs" id="win-label-2p">First to 7</span></button>
    <button class="bg-transparent border-none text-white/30 text-xs font-mono cursor-pointer mt-5 hover:text-white" onclick="showScreen('screen-menu')">← Back</button>
  </div>
</div>
<script>
let selectedDiff = "easy", selectedWinning = 7, selectedMode = "ai";

function showScreen(id) {
  ["screen-menu","screen-mode","screen-2p"].forEach(s => {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
}
function setDiff(d) {
  selectedDiff = d;
  ["easy","medium","hard","pro"].forEach(x => document.getElementById("d-"+x).classList.toggle("active-neon", x === d));
}
function setWinning(n) {
  selectedWinning = n;
  [3,5,7,10].forEach(x => {
    let e1 = document.getElementById("w-"+x), e2 = document.getElementById("w2-"+x);
    if (e1) e1.classList.toggle("active-neon", x === n);
    if (e2) e2.classList.toggle("active-neon", x === n);
  });
  let label = "First to " + n;
  let el = document.getElementById("win-label");
  if (el) el.textContent = label;
  let el2 = document.getElementById("win-label-2p");
  if (el2) el2.textContent = label;
}
function goMode(m) {
  selectedMode = m;
  showScreen(m === "2p" ? "screen-2p" : "screen-mode");
}
function startGame() {
  window.location.href = "game.html?mode=" + selectedMode + "&difficulty=" + selectedDiff + "&winning=" + selectedWinning;
}
let deferredPrompt = null;
function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
  }
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').classList.remove('hidden');
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('install-btn').classList.add('hidden');
});
function startOnline() {
  window.location.href = "game.html?mode=online";
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
